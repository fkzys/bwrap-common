# bwrap-common default seccomp blocklist
# format: <syscall> <action> [aN (==|!=|&|>) <value|SYMBOL>]
#   action: EPERM | ENOSYS
#   '&' matches when (arg & mask) == mask
#   '>' matches when arg is greater than the value
# default action: ALLOW (blocklist mode)
# syscalls unknown on the target arch are skipped with a warning; --strict
# only rejects names unknown on every supported architecture

# dmesg / accounting / quota
syslog              EPERM
acct                EPERM
quotactl            EPERM
uselib              EPERM

# kernel keyring (shared per-uid)
add_key             EPERM
keyctl              EPERM
request_key         EPERM

# namespaces / mounts
mount               EPERM
umount              EPERM
umount2             EPERM
pivot_root          EPERM
chroot              EPERM
unshare             EPERM
setns               EPERM
clone               EPERM  a0 & CLONE_NEWUSER
clone3              ENOSYS
open_tree           ENOSYS
move_mount          ENOSYS
fsopen              ENOSYS
fsconfig            ENOSYS
fsmount             ENOSYS
fspick              ENOSYS
mount_setattr       ENOSYS

# tty injection
ioctl               EPERM  a1 == TIOCSTI
ioctl               EPERM  a1 == TIOCLINUX

# profiling / tracing / persona
perf_event_open     EPERM
ptrace              EPERM
# allow PER_LINUX (0) and PER_LINUX32 (8); block other execution domains.
# personality(0xffffffff) is a query form and is also blocked by > 8; this is
# a deliberate trade-off because libseccomp allows only one comparison per arg.
personality         EPERM  a0 == 1
personality         EPERM  a0 == 2
personality         EPERM  a0 == 3
personality         EPERM  a0 == 4
personality         EPERM  a0 == 5
personality         EPERM  a0 == 6
personality         EPERM  a0 == 7
personality         EPERM  a0 > 8
modify_ldt          EPERM

# modern high-risk interfaces
io_uring_setup      EPERM
io_uring_enter      EPERM
io_uring_register   EPERM
userfaultfd         EPERM
bpf                 EPERM

# cross-process memory
process_vm_readv    EPERM
process_vm_writev   EPERM
